title: Lantern Rot Software
description: "An independent game and software studio: Dorf, a dark-fantasy hero battler for Android, and Twitch chat games built for streamers."
url: https://lanternrot.com
lang: en

# Post dates (and the time of day that orders same-day posts) are read as Eastern.
timezone: America/New_York

# News posts live in _posts/ and are served at /news/YYYY/MM/DD/slug/.
permalink: /news/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

plugins:
  - jekyll-feed

feed:
  path: feed.xml

# The Web3Forms access key for the beta form (requests go to beta@lanternrot.com).
# It is public by design: it ends up in the page source either way. If it is
# ever blank or reset to a "PASTE-..." stand-in, the form refuses to send and
# tells the visitor it isn't connected yet.
web3forms_access_key: "1fd6c060-24d6-4023-b907-a13e81e724c9" # gitleaks:allow (public by design)

# Dev tooling and local-only files never ship to the site.
exclude:
  - tools/
  - tests/
  - package.json
  - package-lock.json
  - node_modules/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - TEST-LIST.md
  - README*
